name: CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  backend:
    name: Backend build (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build all modules
        run: mvn -B clean install -Dmaven.test.skip=true

  frontend:
    name: Frontend build (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-rental-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: car-rental-ui/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Build & push Docker images
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - car-service
          - booking-service
          - payment-service
          - notification-service
          - car-rental-ui
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/car-rental-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/car-rental-${{ matrix.service }}:${{ github.sha }}

  deploy:
    name: Deploy to server
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SERVER_HOST is not set — skipping deploy. Add the deploy secrets to enable it."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull new images and restart on the server
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: GHCR_ACTOR,GHCR_TOKEN,DEPLOY_PATH
          script: |
            cd "$DEPLOY_PATH"
            git pull --ff-only
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/car-rental' }}
